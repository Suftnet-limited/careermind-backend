<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Cancelled — Tranquis</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #6c47ff;
    --indigo: #4338ca;
    --text: #1a1523;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f9f8ff;
    --white: #ffffff;
    --radius: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    background: var(--white);
    border-radius: 24px;
    padding: 40px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
  }

  .icon {
    font-size: 48px;
    margin-bottom: 20px;
    display: block;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 32px;
  }

  .btn {
    display: block;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 24px;
    border-radius: var(--radius);
    text-decoration: none;
    width: 100%;
    margin-bottom: 12px;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--purple) 0%, var(--indigo) 100%);
    color: white;
  }

  .btn-primary:active { opacity: 0.9; transform: scale(0.99); }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    padding: 12px;
  }
</style>
</head>
<body>

<div class="card">
  <span class="icon">😕</span>
  <h1>No worries</h1>
  <p class="subtitle">Your payment was not completed. No charge has been made to your card.</p>

  <a href="/tranquis/subscribe?user_id={{ user_id }}" class="btn btn-primary">Try Again</a>
  <a href="{{ app_url }}" class="btn btn-secondary">Return to app</a>
</div>

</body>
</html>
